name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: go test ./...
      - name: Build
        run: make web linux VERSION=${{ github.ref_name }}
      - name: Checksums
        run: cd bin && sha256sum lmcwhm-linux-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" bin/lmcwhm-linux-amd64 bin/lmcwhm-linux-arm64 bin/SHA256SUMS deploy/install.sh \
            --title "${{ github.ref_name }}" --generate-notes
