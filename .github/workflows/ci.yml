name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./... && go test ./...
      - run: make web linux

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web linux
      - name: Installer end-to-end (fresh, upgrade, reset-panel, rollback)
        run: sudo bash deploy/test-installer.sh bin/lmcwhm-linux-amd64

  sites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web linux
      - name: Install panel
        run: sudo bash deploy/install.sh --binary bin/lmcwhm-linux-amd64 --skip-docker --port 18888 --entry /console --username admin --password Passw0rd1
      - name: Websites end-to-end (HAProxy SNI, PHP, SSL, ACME)
        run: sudo bash deploy/test-sites.sh

  apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web linux
      - name: Install panel
        run: sudo bash deploy/install.sh --binary bin/lmcwhm-linux-amd64 --skip-docker --port 18888 --entry /console --username admin --password Passw0rd1
      - name: App Store, projects, databases, Docker, files end-to-end
        run: sudo bash deploy/test-apps.sh
